name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Extract Project ZIP
        run: |
          unzip adblock_vpn_backup.zip
          # Give execution permissions to any gradlew wrapper found anywhere in the extracted content
          find . -name "gradlew" -exec chmod +x {} +

      - name: Build with Gradle
        run: |
          # Find the directory containing the actual settings.gradle or build.gradle and build from there
          PROJECT_DIR=$(find . -name "settings.gradle" -o -name "build.gradle" | head -n 1 | xargs dirname)
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: adblock-vpn-apk
          path: '**/build/outputs/apk/debug/*.apk'
